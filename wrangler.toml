name = "bet-or-book"
main = "src/index.ts"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]

# The page and its script are served as text by the Worker. The script is a
# file of its own so the page's CSP can forbid inline script entirely.
rules = [
  { type = "Text", globs = ["**/*.html", "**/web/app.js"], fallthrough = false },
]

# Results and the per-day call counts the ledger reports. Not the spend cap:
# KV is eventually consistent and its read-modify-write is not a transaction.
[[kv_namespaces]]
binding = "KV"
id = "864e48a08ae343af924217c67a0669b2"

# One object holds the Nansen spend cap for the whole Worker; one per client
# address counts requests. A Durable Object serves one request at a time,
# which is what makes reserve-then-settle and the rate limit actually hold.
[[durable_objects.bindings]]
name = "NANSEN_BUDGET"
class_name = "NansenBudget"

[[durable_objects.bindings]]
name = "REQUEST_GATE"
class_name = "RequestGate"

# SQLite-backed classes, which is what the Workers free plan supports.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NansenBudget", "RequestGate"]

# Structured logs, so a budget refusal or a failing upstream can be seen
# without adding print statements to a deployed Worker. This flag is logs;
# it is not latency, error-rate, fallback, cache-hit or credit measurement,
# and none of those exist yet (audit C03). Sampled traces are a separate
# setting and are deliberately not on: there is nothing to correlate them
# against until those measurements do exist.
[observability]
enabled = true

[vars]
NANSEN_DAILY_CREDIT_CAP = "300"
NANSEN_CREDIT_FLOOR = "5"
# Credits of the cap that public checks may not reach, so an afternoon of
# visitors cannot leave the demo with a Hyperliquid-only answer. Reaching
# them needs the DEMO_KEY secret, which is not set by default.
NANSEN_DEMO_RESERVE = "40"
