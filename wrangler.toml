name = "bet-or-book"
main = "src/index.ts"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]

# The page and its script are served as text by the Worker. The script is a
# file of its own so the page's CSP can forbid inline script entirely.
# The two fonts and the static fallback picture are raw bytes: satori needs
# a font as an ArrayBuffer, and a PNG is never text. `.wasm` needs no rule of
# its own - Wrangler compiles it to a WebAssembly.Module at build time.
rules = [
  { type = "Text", globs = ["**/*.html", "**/web/app.js"], fallthrough = false },
  { type = "Data", globs = ["**/*.woff", "**/*.png"], fallthrough = false },
]

# Results and the per-day call counts the ledger reports. Not the spend cap:
# KV is eventually consistent and its read-modify-write is not a transaction.
[[kv_namespaces]]
binding = "KV"
id = "864e48a08ae343af924217c67a0669b2"

# One object holds the Nansen spend cap for the whole Worker; one per client
# address counts requests. A Durable Object serves one request at a time,
# which is what makes reserve-then-settle and the rate limit actually hold.
[[durable_objects.bindings]]
name = "NANSEN_BUDGET"
class_name = "NansenBudget"

[[durable_objects.bindings]]
name = "REQUEST_GATE"
class_name = "RequestGate"

# SQLite-backed classes, which is what the Workers free plan supports.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NansenBudget", "RequestGate"]

# Logs, and the measurements built on them. Every check, picture and saved
# reading leaves one JSON line (src/telemetry.ts): latency, cache hit or
# fresh, degraded, the reason that decided the verdict, credits spent,
# budget refusals, failed saves. Workers Logs indexes the fields, and its
# query builder gives P50/P95 and counts over them (docs/architecture.md,
# "What the Worker counts"). Traces were left off until there was something
# to correlate them against (audit C03); with those events in place, one
# request in ten is traced, which at this site's traffic stays far inside
# the free plan's 200,000 observability events a day.
[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[vars]
# Raised from 300 for 25-27 September (judging week): the public share (cap
# minus NANSEN_DEMO_RESERVE) was exhausted by roughly 35-40 checks a day at
# up to 7 credits each, which a single afternoon of visitors clears easily.
# The account balance (~916 credits as of 24.09) and NANSEN_CREDIT_FLOOR
# still bound total spend regardless of this number. Revert to 300 (or lower)
# after the buildathon window closes (2026-09-27 23:59 UTC).
NANSEN_DAILY_CREDIT_CAP = "600"
NANSEN_CREDIT_FLOOR = "5"
# Credits of the cap that public checks may not reach, so an afternoon of
# visitors cannot leave the demo with a Hyperliquid-only answer. Reaching
# them needs the DEMO_KEY secret, which is not set by default.
NANSEN_DEMO_RESERVE = "40"
