name = "bet-or-book"
main = "src/index.ts"
workers_dev = false
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]

# The page and its script are served as text by the Worker. The script is a
# file of its own so the page's CSP can forbid inline script entirely.
# The fonts and the static fallback picture are raw bytes: satori needs a
# font as an ArrayBuffer, a PNG is never text, and the page's own Geist
# woff2 files are served exactly as they are. One Data rule holds all three
# globs: Wrangler ignores a second rule of the same type unless the first
# says `fallthrough = true`, and the build then fails on the .woff2 import.
# `.wasm` needs no rule of its own - Wrangler compiles it to a
# WebAssembly.Module at build time.
rules = [
  { type = "Text", globs = ["**/*.html", "**/web/app.min.js"], fallthrough = false },
  { type = "Data", globs = ["**/*.woff", "**/*.woff2", "**/*.png"], fallthrough = false },
]

[[routes]]
pattern = "bet-or-book.trade"
custom_domain = true

# Results: cached checks, saved readings and drawn pictures.
[[kv_namespaces]]
binding = "KV"
id = "864e48a08ae343af924217c67a0669b2"

# NansenBudget is the retired Nansen credit meter: a check makes no Nansen
# call (stage 3), and it answers 410 to anything. It keeps its binding and
# class because deleting a Durable Object class takes a migration. One
# RequestGate per client address counts requests; a Durable Object's input
# and output gates are what make that count hold under concurrency.
[[durable_objects.bindings]]
name = "NANSEN_BUDGET"
class_name = "NansenBudget"

[[durable_objects.bindings]]
name = "REQUEST_GATE"
class_name = "RequestGate"

[[durable_objects.bindings]]
name = "PILOT_WATCH"
class_name = "PilotWatch"

# SQLite-backed classes, which is what the Workers free plan supports.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NansenBudget", "RequestGate"]

[[migrations]]
tag = "v2-pilot-watch"
new_sqlite_classes = ["PilotWatch"]

[triggers]
crons = ["0 * * * *"]

# Logs, and the measurements built on them. Every check, picture and saved
# reading leaves one JSON line (src/telemetry.ts): latency, cache hit or
# fresh, degraded, the reason that decided the verdict, failed saves.
# Workers Logs indexes the fields, and its query builder gives P50/P95 and
# counts over them (docs/architecture.md,
# "What the Worker counts"). Traces were left off until there was something
# to correlate them against (audit C03); with those events in place, one
# request in ten is traced, which at this site's traffic stays far inside
# the free plan's 200,000 observability events a day.
[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# No plain-text variables. Secrets, set with `npx wrangler secret put <NAME>`
# (.dev.vars locally, see .dev.vars.example):
#   BLOCKSCOUT_API_KEY  optional; the funding links come from the Blockscout
#                       explorer, and without it Ethereum is read keyless and
#                       Arbitrum is said to be not read
#   DEMO_KEY            optional; the `x-demo-key` header that skips the
#                       public rate limits

[build]
command = "npm run build:web"
