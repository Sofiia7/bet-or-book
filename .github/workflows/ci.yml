# Every push runs what a reviewer would run by hand, in the order that fails
# cheapest first. The 21.09 audit found no CI at all: the tests and the
# typecheck existed and nothing made them a condition of anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - name: Browser asset is up to date
        run: npm run build:web && git diff --exit-code -- web/app.min.js
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Runtime tests (workerd)
        # The Worker as Wrangler builds it, in the real runtime: the spend
        # cap under concurrent checks, a Durable Object restarting, a reader
        # disconnecting, KV failing and KV lagging (23.09 audit, S05).
        run: npm run test:runtime
      - name: Worker builds
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
      - name: No secret in the tree
        # .dev.vars is git-ignored; this fails the build if a key is ever
        # committed by another route. The pattern is Nansen's key shape, not
        # a value.
        run: |
          if git grep -nE '(NANSEN_API_KEY|DEMO_KEY|apikey)\s*[:=]\s*["'\'']?[A-Za-z0-9]{20,}' -- . ':!*.yml'; then
            echo "A credential looks committed. Rotate it and remove it from history."
            exit 1
          fi
